# staticcheck configuration for hashgramctl, inherited from the repository
# root and overriding one check.
#
# ST1005 requires that error strings not be capitalised and not end in
# punctuation. The reason for that convention is composition: when an error is
# wrapped with fmt.Errorf("doing x: %w", err) the result should read as one
# sentence, and "doing x: Could not open file." does not.
#
# The errors in this package are not wrapped. They are returned from cobra
# RunE and printed directly to an operator, and several of them are
# deliberately several paragraphs long, because the situations they describe
# are ones where a terse message would leave someone stuck. For example, the
# genesis hash mismatch error explains what the check is for, and the missing
# Founder address error explains why the tool will not invent one and points
# at the runbook.
#
# Rewriting those into single lowercase clauses with no terminal punctuation
# would satisfy the linter and make the tool worse to use. Disabling the check
# for this package, with the reason recorded, is the honest trade.
#
# Every other check, including all of the SA correctness checks, remains on.

checks = ["all", "-ST1005"]
