# staticcheck configuration for Hashgram.
#
# Everything is enabled. The SA (correctness) checks are the ones that matter
# most in a consensus codebase, where a subtle bug is not a crash on one
# machine but a chain halt or a state divergence across the network.
#
# Generated protobuf and grpc-gateway files are excluded by the CI runner
# (scripts/dev/ci.sh) rather than here, because staticcheck has no
# file-exclusion option and the alternative is to disable the deprecation
# check globally. The generated gateway code uses github.com/golang/protobuf
# and grpc.Dial, both deprecated, and neither is ours to fix: it comes from
# protoc-gen-grpc-gateway. Suppressing SA1019 everywhere to silence it would
# also suppress genuine use of deprecated SDK APIs in our own code, which is
# exactly what we want to be told about before an SDK upgrade.

checks = ["all"]

# Initialisms staticcheck should recognise in identifier names.
initialisms = [
  "ACL", "API", "ASCII", "CPU", "CSS", "DNS", "EOF", "GUID", "HTML", "HTTP",
  "HTTPS", "ID", "IP", "JSON", "QPS", "RAM", "RPC", "SLA", "SMTP", "SQL",
  "SSH", "TCP", "TLS", "TTL", "UDP", "UI", "GID", "UID", "UUID", "URI",
  "URL", "UTF8", "VM", "XML", "XMPP", "XSRF", "XSS",
  # Hashgram-specific
  "ABCI", "BIP", "E2EE", "HD", "MLS", "P2P", "SFU", "TURN", "UTS",
]

dot_import_whitelist = []
http_status_code_whitelist = []
