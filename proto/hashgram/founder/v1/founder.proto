syntax = "proto3";
package hashgram.founder.v1;

import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/hashgram/hashgram/x/founder/types";

// Params configures the Founder protocol revenue share.
//
// What this is: a share of fee revenue the protocol itself has already
// collected (transaction gas fees, and explicit service fees such as username
// registration).
//
// What this is NOT: a tax on transferred value. If Alice sends Bob 100 HASH,
// Bob receives 100 HASH. The Founder receives nothing from the 100. Alice
// separately pays gas, and the Founder receives 1% of that gas. See
// docs/TOKENOMICS.md and the tests in x/feerouter.
message Params {
  // beneficiary is the address that receives Founder revenue.
  //
  // It is set at genesis from a PUBLIC address supplied by the Founder and can
  // afterwards be changed only by a governance proposal. The corresponding
  // private key is never required on any Hashgram server: payouts are pushed
  // to this address by the protocol, and the permissionless
  // MsgClaimFounderRevenue can be sent by anyone.
  string beneficiary = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // fee_basis_points is the Founder share of qualifying protocol fee revenue.
  // 100 basis points = 1%.
  //
  // A compile-time ceiling in app/params caps this at 100 bps. Governance can
  // lower it but cannot raise it above the ceiling; doing that requires
  // shipping a new binary that the validator set must adopt. "The Founder
  // quietly raised their cut" is therefore not representable in state.
  uint32 fee_basis_points = 2;

  // payout_period_blocks is how often accrued revenue is automatically pushed
  // to the beneficiary. Zero disables automatic payout, leaving only the
  // permissionless claim message.
  //
  // Batching exists so that a cold-wallet or multisig beneficiary is not
  // buried under one dust transfer per block.
  uint64 payout_period_blocks = 3;

  // min_payout is the minimum accrued amount that triggers an automatic
  // payout. Accrual below this threshold simply waits.
  repeated cosmos.base.v1beta1.Coin min_payout = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (amino.dont_omitempty) = true
  ];
}

// RevenueLedger is the running record of Founder revenue.
//
// Both totals are monotonically non-decreasing and are exposed by query, so
// "where did my 1% go?" is answerable from chain state alone without trusting
// an operator's bookkeeping.
message RevenueLedger {
  // total_accrued is every coin ever credited to the Founder.
  repeated cosmos.base.v1beta1.Coin total_accrued = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (amino.dont_omitempty) = true
  ];

  // total_paid is every coin ever pushed to a beneficiary address.
  repeated cosmos.base.v1beta1.Coin total_paid = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (amino.dont_omitempty) = true
  ];

  // last_payout_height is the block height of the most recent payout, or 0.
  int64 last_payout_height = 3;

  // last_payout_beneficiary records who was paid last. Retained across a
  // governance change of beneficiary so the history stays auditable.
  string last_payout_beneficiary = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// BeneficiaryChange is an audit record of a governance-approved beneficiary
// change. The full history is kept: a silent beneficiary swap should not be
// possible, and an observer should be able to see every change that ever
// happened without replaying the chain.
message BeneficiaryChange {
  // height is the block at which the change took effect.
  int64 height = 1;

  // previous_beneficiary is the address that was replaced.
  string previous_beneficiary = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // new_beneficiary is the address that took over.
  string new_beneficiary = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
