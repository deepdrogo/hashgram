syntax = "proto3";
package hashgram.serviceproof.v1;

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "hashgram/serviceproof/v1/provider.proto";

option go_package = "github.com/hashgram/hashgram/x/serviceproof/types";

// ServiceReceipt is a client-signed statement that a provider served them.
//
// This is the answer to "never trust self-reported values". A provider cannot
// manufacture credit by claiming numbers; it must present a signature from
// the counterparty it served. The provider submits the receipt, but the
// signature is the client's.
//
// Two attacks remain and are handled at the accounting layer rather than
// here, because no signature can rule them out:
//
//   - Self-traffic. A provider serving itself is rejected outright: the
//     client key may not be the provider's own operator, reward address or
//     node key.
//   - Two nodes trading fake traffic. Each can legitimately sign for the
//     other. This is bounded by a concentration cap: credit that comes
//     overwhelmingly from a single counterparty is discounted, so a
//     two-node ring earns a small fraction of what its raw numbers claim.
//     See keeper.CreditForEpoch.
message ServiceReceipt {
  // provider is the operator address of the node being credited.
  string provider = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // role is the service this receipt attests to.
  ServiceRole role = 2;

  // client_pubkey is the raw public key of the client that signed.
  bytes client_pubkey = 3;

  // client_key_type is the client's signature scheme.
  KeyType client_key_type = 4;

  // epoch is the accounting period this work belongs to. A receipt for a
  // settled epoch is rejected: settlement must be final.
  uint64 epoch = 5;

  // nonce is unique per (provider, client). Replay is rejected.
  uint64 nonce = 6;

  // units is the amount of work: bytes relayed, bytes retrieved, or call
  // seconds, depending on role. Interpretation is per-role and documented in
  // docs/SERVICE_REWARDS.md.
  uint64 units = 7;

  // expiry_height bounds how long a receipt may be held before submission.
  int64 expiry_height = 8;

  // client_signature is over the domain-separated digest of the canonical
  // encoding of every field above, under the "service-receipt" purpose.
  bytes client_signature = 9;
}

// KeyType identifies a signature scheme.
enum KeyType {
  option (gogoproto.goproto_enum_prefix) = false;

  KEY_TYPE_UNSPECIFIED = 0;

  // KEY_TYPE_SECP256K1 is a 33-byte compressed secp256k1 public key.
  KEY_TYPE_SECP256K1 = 1;

  // KEY_TYPE_ED25519 is a 32-byte ed25519 public key, used by device keys.
  KEY_TYPE_ED25519 = 2;
}

// StorageAssignment records that a provider is responsible for a blob.
//
// Assignments are what turn declared disk into paid disk. A provider with a
// petabyte declared and no assignments has no assignments to be challenged
// on, accrues no byte-hours, and earns nothing. This is the mechanism behind
// "empty unused disk does not earn storage rewards".
message StorageAssignment {
  // blob_id is the content identifier of the assigned blob.
  bytes blob_id = 1;

  // provider is the operator address responsible for this replica.
  string provider = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // replica_index distinguishes the replicas of one blob.
  uint32 replica_index = 3;

  // size_bytes is the blob size, which is the byte figure that accrues
  // byte-hours.
  uint64 size_bytes = 4;

  // chunk_size is the fixed chunk size the Merkle tree was built over.
  uint32 chunk_size = 5;

  // chunk_count is the number of leaves in the Merkle tree.
  uint32 chunk_count = 6;

  // merkle_root commits to the chunk hashes. Challenges are answered with a
  // Merkle path against this root, which is what makes a storage proof
  // verifiable on chain without the chain holding the data.
  bytes merkle_root = 7;

  // assigned_epoch is when this assignment began.
  uint64 assigned_epoch = 8;

  // last_credited_epoch is the most recent epoch for which byte-hours were
  // credited, so credit is not counted twice.
  uint64 last_credited_epoch = 9;

  // active is false once the assignment is released or repaired away.
  bool active = 10;
}

// StorageChallenge asks a provider to prove it still holds a specific chunk.
//
// Challenges are issued by the chain, not requested by the provider, and the
// chunk index is derived from block entropy the provider cannot predict when
// it decides whether to actually keep the data.
message StorageChallenge {
  // id is the challenge identifier.
  uint64 id = 1;

  // provider is who must answer.
  string provider = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // blob_id and replica_index identify the assignment being challenged.
  bytes blob_id = 3;
  uint32 replica_index = 4;

  // chunk_index is the leaf the provider must produce a Merkle path for.
  uint32 chunk_index = 5;

  // issued_height and issued_epoch are when the challenge was created.
  int64 issued_height = 6;
  uint64 issued_epoch = 7;

  // deadline_height is the last block at which an answer is accepted. A
  // missed deadline counts as a failure, not as a non-event: a provider that
  // simply ignores challenges must not be able to keep earning.
  int64 deadline_height = 8;

  // answered and passed record the outcome.
  bool answered = 9;
  bool passed = 10;
}

// ChallengeResponse is a provider's answer to a storage challenge.
message ChallengeResponse {
  // challenge_id identifies the challenge being answered.
  uint64 challenge_id = 1;

  // chunk_hash is the hash of the challenged chunk.
  bytes chunk_hash = 2;

  // merkle_path is the sibling hashes from the leaf to the root, bottom
  // first.
  repeated bytes merkle_path = 3;

  // node_signature is over the domain-separated digest of the response,
  // under the "storage-challenge" purpose, by the provider's node key. The
  // Merkle proof alone would be replayable by anyone who observed it; the
  // signature ties the answer to the node that was asked.
  bytes node_signature = 4;
}

// FraudReport records a rejected piece of evidence or a failed challenge.
//
// Kept as explicit state rather than only as a counter, so that "why was this
// provider slashed?" has an answer that does not require replaying the chain.
message FraudReport {
  string provider = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 sequence = 2;
  int64 height = 3;

  // reason is a stable machine-readable code, e.g. "challenge_failed",
  // "challenge_missed", "self_traffic", "invalid_signature".
  string reason = 4;

  // detail is human-readable context.
  string detail = 5;

  // score_added is how much this report added to the provider's fraud score.
  uint32 score_added = 6;
}
