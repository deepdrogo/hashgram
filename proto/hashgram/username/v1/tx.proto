syntax = "proto3";
package hashgram.username.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "hashgram/username/v1/username.proto";

option go_package = "github.com/hashgram/hashgram/x/username/types";

// Msg is the x/username message service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // Register claims an available @username.
  rpc Register(MsgRegister) returns (MsgRegisterResponse);

  // Renew extends a registration.
  rpc Renew(MsgRenew) returns (MsgRenewResponse);

  // Transfer hands a name to another address.
  rpc Transfer(MsgTransfer) returns (MsgTransferResponse);

  // SetTransferable locks or unlocks transfer for a name.
  //
  // Locking is a defence against key compromise: an attacker who steals the
  // owner key still cannot move a locked name, and unlocking is itself a
  // transaction the owner would see.
  rpc SetTransferable(MsgSetTransferable) returns (MsgSetTransferableResponse);

  // Release gives up a name voluntarily.
  rpc Release(MsgRelease) returns (MsgReleaseResponse);

  // UpdateParams changes the username configuration. Governance only.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// MsgRegister claims a username.
message MsgRegister {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "hashgram/MsgRegisterUsername";

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // name is the requested username, with or without a leading '@'. It is
  // normalised before any check, so the caller does not have to.
  string name = 2;
}

// MsgRegisterResponse reports the normalised name that was registered.
message MsgRegisterResponse {
  // name is the normalised form actually stored, which may differ from what
  // was requested.
  string name = 1;

  int64 expiry_height = 2;
}

// MsgRenew extends a registration.
message MsgRenew {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "hashgram/MsgRenewUsername";

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 2;
}

// MsgRenewResponse reports the new expiry.
message MsgRenewResponse {
  int64 expiry_height = 1;
}

// MsgTransfer hands a name to another address.
message MsgTransfer {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "hashgram/MsgTransferUsername";

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 2;
  string new_owner = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgTransferResponse is the response type.
message MsgTransferResponse {}

// MsgSetTransferable locks or unlocks transfer for a name.
message MsgSetTransferable {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "hashgram/MsgSetTransferable";

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 2;
  bool transferable = 3;
}

// MsgSetTransferableResponse is the response type.
message MsgSetTransferableResponse {}

// MsgRelease gives up a name.
message MsgRelease {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "hashgram/MsgReleaseUsername";

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 2;
}

// MsgReleaseResponse is the response type.
message MsgReleaseResponse {}

// MsgUpdateParams changes the username configuration.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "hashgram/MsgUpdateNameParams";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false];
}

// MsgUpdateParamsResponse is the response type.
message MsgUpdateParamsResponse {}
